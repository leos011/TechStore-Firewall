services:
  client:
    build: ./client
    container_name: techstore-client
    cap_add:
      - NET_ADMIN
    networks:
      - lan

  firewall:
    build: ./firewall
    container_name: techstore-firewall
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv4.ip_forward: "1"
    networks:
      lan:
        ipv4_address: 172.20.0.254
      dmz:
        ipv4_address: 172.21.0.254

  web:
    build: ./web
    container_name: techstore-web
    cap_add:
      - NET_ADMIN
    networks:
      dmz:
        ipv4_address: 172.21.0.10

networks:
  lan:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24

  dmz:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/24